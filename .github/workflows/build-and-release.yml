name: Build & Release Extension

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Validate & Package Extension
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate JavaScript Syntax
        run: |
          echo "Validating JavaScript files..."
          node -c utils/db.js
          node -c utils/storage.js
          node -c utils/metadata.js
          node -c utils/obsidian.js
          node -c utils/notion.js
          node -c utils/logseq.js
          node -c utils/anki.js
          node -c utils/endnote.js
          node -c utils/bear.js
          node -c utils/zotero.js
          node -c background/service-worker.js
          node -c content/content.js
          node -c popup/popup.js
          node -c manager/manager.js
          node -c options/options.js
          echo "All JS syntax is valid!"

      - name: Ensure SQLite WASM Assets
        run: |
          mkdir -p lib
          if [ ! -f lib/sql-wasm.js ]; then
            echo "Downloading sql-wasm.js..."
            curl -sL https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.12.0/sql-wasm.js -o lib/sql-wasm.js
          fi
          if [ ! -f lib/sql-wasm.wasm ]; then
            echo "Downloading sql-wasm.wasm..."
            curl -sL https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.12.0/sql-wasm.wasm -o lib/sql-wasm.wasm
          fi
          ls -la lib/

      - name: Validate Manifest & Required Assets
        id: manifest
        run: |
          node -e "
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
          console.log('Manifest Name:', manifest.name);
          console.log('Version:', manifest.version);
          if (!fs.existsSync('lib/sql-wasm.wasm')) throw new Error('Missing lib/sql-wasm.wasm');
          if (!fs.existsSync('lib/sql-wasm.js')) throw new Error('Missing lib/sql-wasm.js');
          if (!fs.existsSync('icons/icon-128.png')) throw new Error('Missing icons');
          console.log('VERSION=' + manifest.version);
          // Export as environment variable for subsequent steps
          fs.appendFileSync(process.env.GITHUB_ENV, 'EXT_VERSION=' + manifest.version + '\n');
          // Also set step output so other workflow expressions can access the version safely
          if (process.env.GITHUB_OUTPUT) {
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'version=' + manifest.version + '\n');
          }
          "

      - name: Package Extension ZIP
        id: package
        run: |
          mkdir -p dist
          ZIP_NAME="academic-notes-v${EXT_VERSION}.zip"
          echo "Creating ${ZIP_NAME}..."
          
          # Create clean distribution zip
          zip -r "dist/${ZIP_NAME}" \
            manifest.json \
            README.md \
            background/ \
            content/ \
            manager/ \
            popup/ \
            options/ \
            utils/ \
            lib/ \
            icons/ \
            -x "*.DS_Store" "*.git*" "*__pycache__*"

          echo "PACKAGE_PATH=dist/${ZIP_NAME}" >> $GITHUB_ENV
          # Also expose the package path as a step output so it can be safely referenced
          if [ -n "$GITHUB_OUTPUT" ]; then
            echo "package_path=dist/${ZIP_NAME}" >> "$GITHUB_OUTPUT"
          fi
          echo "ZIP created successfully: dist/${ZIP_NAME}"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: academic-notes-extension-v${{ steps.manifest.outputs.version }}
          path: dist/

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "Release v${{ steps.manifest.outputs.version }}"
          files: ${{ env.PACKAGE_PATH }}
          generate_release_notes: true
          draft: false
          prerelease: false
